---
# AWX Operator 2.19.1, the release that installs AWX 24.6.1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awx

resources:
  - github.com/ansible/awx-operator/config/default?ref=2.19.1
  - awx-admin-secret.yaml
  - awx.yaml

images:
  - name: quay.io/ansible/awx-operator
    newTag: 2.19.1
  # The operator's second container. Its old registry, gcr.io/kubebuilder,
  # was shut down in 2025, so take the same image from its project's registry.
  - name: gcr.io/kubebuilder/kube-rbac-proxy
    newName: quay.io/brancz/kube-rbac-proxy
