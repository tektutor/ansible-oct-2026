# Ansible managed
# Environment: training
# Backends: web1, web2, web3

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream app_backend {
        least_conn;
        server 192.168.122.11:8080 weight=3;
        server 192.168.122.12:8080 weight=1;
        server 192.168.122.13:8081 backup;
    }

    server {
        listen 80;
        server_name app.tektutor.org;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            return 200 "training ok\n";
        }
    }
}
