---
- name: Explore facts on Windows
  hosts: windows
  gather_facts: true
  gather_subset:
    - min
    - memory
    - interfaces

  tasks:
    - name: Count the facts this subset returned
      ansible.builtin.debug:
        msg: "Collected {{ ansible_facts | length }} top-level facts"

    - name: Show a few common facts
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "OS: {{ ansible_facts['os_name'] }}"
          - "Version: {{ ansible_facts['distribution_version'] }}"
          - "Memory (MB): {{ ansible_facts['memtotal_mb'] }}"
          - "IP addresses: {{ ansible_facts['ip_addresses'] | join(', ') }}"

    - name: Filter the facts by key name on the control node
      ansible.builtin.debug:
        msg: "{{ ansible_facts | dict2items | selectattr('key', 'search', 'mem') | items2dict }}"

    - name: Use a fact in a condition
      ansible.builtin.debug:
        msg: This server has less than 4 GB of memory
      when: ansible_facts['memtotal_mb'] | int < 4096

    - name: Save all facts to a file on the control node
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/facts-{{ inventory_hostname }}.json"
        content: "{{ ansible_facts | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost
